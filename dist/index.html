<script>const COURSE = {"id": "vocal-listening-lab", "version": 1, "title": "VOCAL LISTENING LAB", "lessons": [{"id": "lesson-01", "number": 1, "title": "声の輪郭をつかむ", "lead": "「好きな声」を、もう一段具体的に。", "lecture": ["歌い手を覚える入口は、声の印象でいい。温かい、澄んでいる、近くで話しているみたい。その印象が生まれた場所を、一つだけ探してみよう。音の始まり、伸びる母音、最後に消える瞬間。同じ声でも、時間の中では表情が動いている。", "今日はSam Cooke、Carpenters、Norah Jonesを比較する。「誰が一番よい声か」ではなく、自分がどの変化に耳を引かれたかを見つける。声の特徴と、録音の近さをひとまず分けて考えるのも、よい出発点になる。"], "goal": "一つのフレーズの始まり・途中・終わりを区別して説明する。", "question": "最初の印象を作っていたのは、どの部分だった？", "exercise": "自分で作った短い言葉を、普段の声で二通り言う。最後を短く切る／少し長く残す。高さや大きさをできるだけそろえて比べる。", "silent": "指でフレーズの長さをなぞり、終わりの形を「切れる／薄くなる／次へ続く」でメモする。", "answer": "「柔らかいと感じた理由を、音の入りか語尾かに分けて探した。語尾に注目すると、最初の印象が変わった。」実際に選んだ曲と場面を追記する。", "recordingIds": ["rec-001", "rec-002", "rec-003"]}, {"id": "lesson-02", "number": 2, "title": "言葉は拍のどこに着く？", "lead": "メロディーを追いながら、言葉の足取りを聴く。", "lecture": ["言葉の最初の子音と、音の高さがよく聞こえる母音は、必ずしも同じ瞬間に始まらない。歌を拍の前・後ろで説明するときは、何を目印にしているかを決めよう。伴奏の拍、言葉の輪郭、フレーズの着地点を別々に追うと、歌の動きが見つけやすい。", "Billie Holiday、Frank Sinatra、Ella FitzgeraldとLouis Armstrongを聴く。雰囲気で「遅らせている」と覚える前に、一つの言葉と伴奏の関係を観察してみよう。"], "goal": "子音の入りと母音の中心を混同せず、拍との関係を述べる。", "question": "ゆったり感じる場面でも、言葉の終わりはどこへ着いている？", "exercise": "4拍を数えながら「今日はいい日」を話す。言い始めを変えても、最後を同じ拍に着ける。速さより違いを聴く。", "silent": "手拍子の代わりに指で拍を刻み、気になった語の始まりと終わりを記録する。", "answer": "「入りを遅く感じたが、語尾まで一律に遅れているとは限らなかった。」確認した場面を添える。", "recordingIds": ["rec-004", "rec-005", "rec-006"]}, {"id": "lesson-03", "number": 3, "title": "呼びかけが歌を動かす", "lead": "ソウルを、声と声の関係から聴く。", "lecture": ["ゴスペルやR&Bの文脈をたどるとき、声の迫力だけに注目すると見落とすものがある。主役の呼びかけに別の声が答える。短い言葉を繰り返し、伴奏も熱を増していく。歌は一人の表現であると同時に、応答を生む行為でもある。", "Ray Charles、Aretha Franklin、Otis Reddingの候補曲では、リード、応答、伴奏の三者を追う。歴史的な影響関係は資料で確かめ、似て聞こえるというだけで系譜を結ばない。"], "goal": "コール＆レスポンスを具体的な役割として説明する。", "question": "主役が歌わない瞬間にも、曲の勢いは続いている？", "exercise": "一つの短い言葉を録り、それに答える別の言葉を録る。自作の言葉を使い、原曲の叫びは再現しない。", "silent": "リード／コーラス／楽器の受け渡しを三色でメモする。", "answer": "「主役の語尾の後ろに別の声が入り、区切りが次の始まりにもなっている。」当てはまる箇所を探す。", "recordingIds": ["rec-007", "rec-008", "rec-009"]}, {"id": "lesson-04", "number": 4, "title": "声をリズム楽器として聴く", "lead": "子音と休符にも、グルーヴがある。", "lecture": ["歌のリズムは、音符の数だけでは決まらない。短く切る音、長く保つ母音、次の言葉までの空白。それぞれがドラムやベースと関係を作っている。旋律を追う耳を少し休ませて、声の輪郭だけを聴いてみよう。", "James Brown、Stevie Wonder、Michael Jacksonを比較する。三人を同じ「ファンクの歌い方」にまとめず、短い音と言葉のつながり方を観察する。"], "goal": "伴奏の反復と声のリズムの違いを一つ見つける。", "question": "声が止まったあと、何が拍を運んでいる？", "exercise": "自作の一文を、同じテンポで「語尾を短く／長く」の二通り録る。", "silent": "声のある場所だけ16分グリッドに印を付ける。正確な採譜でなく概略でよい。", "answer": "「長く伸ばす版では、次の音までの空白が減った。短く切る版では伴奏が見えやすくなった。」自分の実験結果として書く。", "recordingIds": ["rec-010", "rec-011", "rec-012"]}, {"id": "lesson-05", "number": 5, "title": "親密さと強弱", "lead": "声が近く感じる理由を探す。", "lecture": ["親密さは小声だけで作られるものではない。言葉のまとまり、音の始まり、フレーズの途中で引く動き、周囲の声の重なり方。聴き手との距離を感じさせる要素を、一つずつ見ていこう。", "Marvin Gaye、Al Green、Donny Hathawayを聴き、主声の変化と録音上の広がりを区別する。息の成分が聞こえることを、そのまま「大量に息を漏らす発声」の指示に置き換えない。"], "goal": "親密という印象を二つの観察に分解する。", "question": "声量以外で、距離を近く感じさせたものは？", "exercise": "普段の声で短い一文を録り、語の区切りだけを変える。ささやき続ける練習は行わない。", "silent": "主声の近さと周囲の空間の広さを、別々の言葉で書く。", "answer": "「伴奏は広く感じるが、主声は手前に聞こえる。声の小ささだけでは説明できない。」", "recordingIds": ["rec-013", "rec-014", "rec-015"]}, {"id": "lesson-06", "number": 6, "title": "装飾と着地点", "lead": "細かな音を、行き先から聴く。", "lecture": ["一つの母音にいくつもの音を載せるメリスマ。まず注目したいのは、数の多さより始まりと終わりだ。短い装飾が言葉を引き延ばし、拍の着地点が次のフレーズを準備する。途中の音を全部採る前に、どこからどこへ向かったかを追おう。", "Chaka Khan、Whitney Houston、Mariah Careyを聴く。装飾、強弱、曲全体の盛り上がりを別々に捉える。高音や大声の再現は課題にしない。"], "goal": "装飾の出発・途中・着地を区別する。", "question": "途中の音を省いても、フレーズの向かう先は残る？", "exercise": "出しやすい高さで二つの近い音をゆっくりつなぐ。難しければ発声は省く。", "silent": "装飾の動きを矢印で描き、最後に落ち着く場所へ印を付ける。", "answer": "「細かな動きより、最後の母音が伴奏のどこに着いたかが印象を決めていた。」", "recordingIds": ["rec-016", "rec-017", "rec-018"]}, {"id": "lesson-07", "number": 7, "title": "高さと声色を分ける", "lead": "高い・低いの先にある、質感の変化。", "lecture": ["音が高くなると、必ず強くなるのだろうか。薄く聞こえる声、厚く聞こえる声、輪郭の変化。高さと質感を別々に記録すると、歌い手が曲の中で選ぶ表情を見つけやすくなる。", "Prince、Jeff Buckley、Minnie Ripertonを聴く。「裏声」「ミックス」といった名前を急いで付ける前に、何がどう変わって聞こえたかを書こう。発声機構は録音だけから確定しない。"], "goal": "高さ、音量、声色を混同しない。", "question": "音が上がった場面で、輪郭と強さはどう変わった？", "exercise": "高音を真似せず、自分の普段の声を一度録り、音の始まりと終わりを観察する。", "silent": "高さと声色の変化を二本の線で描く。高い装飾は聴く課題に限定。", "answer": "「音は上がったが、厚みが増したとは感じなかった。」声の分類名より観察を残す。", "recordingIds": ["rec-019", "rec-020", "rec-021"]}, {"id": "lesson-08", "number": 8, "title": "大きな歌を分解する", "lead": "ロックの迫力を、声・編曲・録音から見る。", "lecture": ["迫力のある歌を聴くと、声量に理由を求めたくなる。けれど、コーラスの重なり、ギターとの応答、残響、静かな場面との落差も、大きさの感覚を変える。完成した音から、どの要素が働いているかを考えてみよう。", "Queen、Led Zeppelin、Tina Turnerの声を扱う。歪みや叫びを力で模倣する課題は設けず、構成や声の出入りを読む。"], "goal": "迫力の理由を声以外も含めて説明する。", "question": "伴奏や重なる声が減ったら、同じ印象になる？", "exercise": "普段の声を録った同じ素材で、無音の間隔だけを変えて比較する。", "silent": "曲中の密度を「少ない／増える／いっぱい」の三段階で記録する。", "answer": "「主声の変化だけでなく、入ってくるコーラスと直前の空白も大きさに関わると感じた。」", "recordingIds": ["rec-022", "rec-023", "rec-024"]}, {"id": "lesson-09", "number": 9, "title": "言葉が場面を作る", "lead": "歌の中の語り手を聴く。", "lecture": ["一つの文章でも、区切り方や強調する言葉が変わると、話している相手や場面が違って感じられる。歌ではそこに旋律と伴奏が加わる。今日の焦点は、言葉がどう並び、どこで表情を変えるかだ。", "Joni Mitchell、Nina Simone、David Bowieを聴く。曲の語り手、作者、実際の歌手の人生は同一と決めつけない。歌詞の全文や訳文は転載せず、テーマの短い要約と聴く場所で案内する。"], "goal": "言葉の区切りと曲の展開を結びつける。", "question": "同じ言葉が、前後の流れで違って聞こえる場所は？", "exercise": "自作の「今日は、ここまでにしよう」を、区切る場所を変えて話す。", "silent": "歌詞の内容を複写せず、場面の変化を自分の短い言葉で要約する。", "answer": "「繰り返しが来る直前の間が変わり、同じ言葉を違う距離から聞いたように感じた。」", "recordingIds": ["rec-025", "rec-026", "rec-027"]}, {"id": "lesson-10", "number": 10, "title": "R&Bの時間感覚", "lead": "反復の上で、声はどう動く？", "lecture": ["同じ伴奏が繰り返されると、声の細かな位置が耳に入りやすくなる。入りを待つ、語尾をつなぐ、短く返す。一律に「後ろへずらす」と考える前に、フレーズの中で何が一定で何が動くかを聴こう。", "D'Angelo、Erykah Badu、Lauryn Hillを比較する。歌だけの印象と、ドラムやベースと一緒に聞いた印象を両方残す。"], "goal": "反復と変化の関係からタイミングを説明する。", "question": "入りの遅さと語尾の位置は、同じ方向に動いている？", "exercise": "自作の短い文を一定の拍に合わせ、言い始めだけを変えて比べる。", "silent": "繰り返す伴奏の目印を一つ決め、声との位置関係を書き込む。", "answer": "「フレーズ全部が同じだけずれているのではなく、途中で伴奏との距離が変わると感じた。」", "recordingIds": ["rec-028", "rec-029", "rec-030"]}, {"id": "lesson-11", "number": 11, "title": "声が重なるとき", "lead": "主役の後ろにも、歌の設計がある。", "lecture": ["リードのメロディーだけを追っていると、声の配置を見落とす。低い支え、高い返答、同じ言葉を重ねる声、別の旋律で動く声。それぞれが役割を持ち、主役の聞こえ方を変えている。", "Earth, Wind & Fire、Boyz II Men、Imogen Heapを比較する。人が重ねた声と電子的な処理は、確認できる制作資料がある場合に区別する。完成音だけで使用機器を決めない。"], "goal": "リードと少なくとも二つの支える役割を区別する。", "question": "主声から耳を外すと、どんな動きが続いている？", "exercise": "自作の一音または一文を二回録り、二つを重ねる。コピーした同一波形との違いを聴く。", "silent": "聞こえる声を、位置と役割の図にする。正確な人数は断定しない。", "answer": "「背後の声はずっと同じ仕事ではなく、支えから応答へ変わった。」", "recordingIds": ["rec-031", "rec-032", "rec-033"]}, {"id": "lesson-12", "number": 12, "title": "日本語を旋律にする", "lead": "母音の長さと、言葉の意味のまとまり。", "lecture": ["普段使う日本語でも、歌になると時間の使い方が変わる。母音を残す、語をまたいでつなぐ、一部分だけ輪郭を立てる。意味が分かるぶん、音としての働きに耳を移すと新しい違いが見つかる。", "宇多田ヒカル、椎名林檎、玉置浩二を聴く。三人の「日本語らしさ」を一つの物差しで測らず、言葉と旋律を結びつけるそれぞれの選択を探す。"], "goal": "母音、子音、言葉の区切りを対象曲の場面で説明する。", "question": "意味の区切りと、音の切れ目は同じ場所にある？", "exercise": "自作の「明日は少し遠くへ」を、話す／出しやすい一音で言う、の二通り録る。", "silent": "一つの短い区間で、長く聞こえた母音と休符を印にする。", "answer": "「言葉としては区切れるところを、母音が次へつないでいるように感じた。」", "recordingIds": ["rec-034", "rec-035", "rec-036"]}, {"id": "lesson-13", "number": 13, "title": "録音が作る声", "lead": "声の近さ、広さ、変形を楽しむ。", "lecture": ["録音された歌には、その場で歌った声に加えて、編集や重ね録り、空間、音の処理が関わる。加工は作品の語り方の一部でもある。何が聞こえるかと、実際にどう作ったかを分けながら聴いてみよう。", "Billie Eilish、Bon Iver、Daft Punkを比較する。近い声、重なる声、加工された輪郭を観察し、同じ印象が別の手段でも作れることを考える。"], "goal": "聞こえる効果と機材名の推定を区別する。", "question": "音の処理が変わると、同じ言葉の距離感はどう変わる？", "exercise": "自分の声の短い録音に、手元の録音アプリで使える残響を少し加える。原音と再生音量を合わせて比較する。", "silent": "手持ちの自作音源がなければ、教材曲の声の近さと広がりを言葉にする。配信音源の保存や抽出は不要。", "answer": "「広がりは増したが、言葉の頭は近く残っている。残響の量だけでなく、その始まりにも注目したい。」", "recordingIds": ["rec-037", "rec-038", "rec-039"]}, {"id": "lesson-14", "number": 14, "title": "自分の歌の選択肢にする", "lead": "聴いてきた言葉で、もう一度自由に聴く。", "lecture": ["最後は説明を先に読む前に、自分の耳で三つの観点を選ぼう。声の入り、語尾、伴奏との関係。これまでの曲と似た働きも、まだ名前を付けられない魅力も見つかるはずだ。", "山下達郎、MISIA、Adoを入口に、一番気になった曲を選ぶ。Adoの歪みや強い発声は聴く課題にとどめる。持ち帰るのは、本人と同じ声になる方法ではなく、自分ならどの表現を選ぶかという判断だ。"], "goal": "根拠のある観察を三つ書き、次に試す一つを選ぶ。", "question": "どの表現を、自分の歌や次の鑑賞に持ち帰りたい？", "exercise": "これまでの自作素材で一つの条件だけ変え、二つの録音を比較する。歌わず、聴く観点だけ選んでも完了。", "silent": "未習の一曲を選び、三つの観察と一つの疑問を書く。", "answer": "「次は語尾の長さを変えたい。理由は、伴奏に場所を渡す瞬間が、自分の好きな曲に共通していたから。」", "recordingIds": ["rec-040", "rec-041", "rec-042"]}], "recordings": [{"id": "rec-001", "lessonId": "lesson-01", "tier": "A", "artist": "Sam Cooke", "title": "You Send Me", "version": "1957年Keenのオリジナル録音", "prompt": "音の高さが落ち着いてから、語尾がどうほどけるか。", "spotifyId": "2dDELaEsvmR9P3UvN8kXpL", "youtube": {"id": "dGQtL1l5i0Q", "type": "公式音源"}, "searchUrl": "https://open.spotify.com/search/Sam%20Cooke%20You%20Send%20Me", "thesis": "滑らかさを、音の始まりと語尾から聴いてみる。", "background": "Sam Cookeはゴスペル・グループSoul Stirrersでの活動を経て、ポップの領域へ進んだ歌手・ソングライターです。「You Send Me」は1957年にKeenから発表された代表的な録音です。歌手としての魅力だけでなく、作品を生み出す側としての活動も、人物ページでたどります。", "analysis": "最初から「柔らかな声」とまとめず、音が始まる瞬間、母音が続く時間、語尾がほどける瞬間の三つに分けます。滑らかさを感じたら、その印象を作っていたのが音のつながりなのか、強弱なのか、伴奏との関係なのかを探してみましょう。", "listens": ["最初の歌の一区切りを聴き、声を追わずに全体の距離感を感じる。", "同じ区間で、長く続く母音の始まりと終わりだけを追う。高さがすぐ定まるか、動きながら落ち着くかにも耳を向ける。", "伴奏に戻り、声が伸びている間と声が消えた後に、ほかの音が何をしているかを聴く。"], "exercise": "自分で作った「今日はここにいる」を、出しやすい高さの一音で短く言う。最後をすっと切る版と、少し残す版を作り、同程度の再生音量で聴き比べる。原曲の旋律や声質を再現する課題ではありません。", "silent": "紙にフレーズ一本の線を描き、終わりを角／なだらかな線で表す。", "pitfall": "柔らかく聞こえる声を、息を大量に漏らすことと結びつけない。完成音には歌い方だけでなく録音も関わります。", "question": "「柔らかい」と感じた場所を、一つの動詞で説明すると？", "scene": "最初の歌い出しから同じ旋律が戻るまで。短い呼びかけを滑らかにつなぐ声と、背後の伴奏・コーラスを別々に聴く。", "points": ["歌い出しの一語を聴き、子音の立ち上がりから母音へ移る速さを確かめる。", "タイトルの言葉が繰り返されるたび、伸ばす母音と語尾の消え方がどう変わるか比べる。", "声が途切れた場所で伴奏とコーラスを追い、主声の近さが何に支えられているか考える。"]}, {"id": "rec-002", "lessonId": "lesson-01", "tier": "B", "artist": "Carpenters", "title": "(They Long to Be) Close to You", "version": "Close to You、スタジオ版", "prompt": "声の輪郭と、長い母音の終わりを追おう。", "spotifyId": "42JfLDGaINRBeAv0tdtfCi", "youtube": {"id": "M268Csnue9I", "type": "公式音源"}, "searchUrl": "https://open.spotify.com/search/Carpenters%20%28They%20Long%20to%20Be%29%20Close%20to%20You", "thesis": "声の輪郭と、長い母音の終わりを追おう。", "background": "", "analysis": "", "listens": ["冒頭から最初の一区切りを聴き、最初の印象を作っていたのは、どの部分だった？", "声の輪郭と、長い母音の終わりを追おう。", "伴奏と一緒に聴き直し、最初の印象がどう変わるかをメモする。"], "exercise": "自分で作った短い言葉を、普段の声で二通り言う。最後を短く切る／少し長く残す。高さや大きさをできるだけそろえて mpt": "言葉のアクセントとリフは、重なるか、すれ違うか。", "spotifyId": "1TV9qMgIML1eyznrB1d4eB", "youtube": {"id": "egqv1mtos6A", "type": "公式音源"}, "searchUrl": "https://open.spotify.com/search/Stevie%20Wonder%20Superstition", "thesis": "言葉のアクセントとリフは、重なるか、すれ違うか。", "background": "", "analysis": "", "listens": ["冒頭から最初の一区切りを聴き、声が止まったあと、何が拍を運んでいる？", "言葉のアクセントとリフは、重なるか、すれ違うか。", "伴奏と一緒に聴き直し、最初の印象がどう変わるかをメモする。"], "exercise": "自作の一文を、同じテンポで「語尾を短く／長く」の二通り録る。", "silent": "声のある場所だけ16分グリッドに印を付ける。正確な採譜でなく概略でよい。", "pitfall": "聞こえた表現から、歌手の意図や身体の使い方を断定しない。", "question": "声が止まったあと、何が拍を運んでいる？", "scene": "クラビネットの反復にドラムと歌が重なる箇所。リフが一定に聞こえるほど、声のアクセントの動きが見えてくる。", "points": ["歌が入る前にクラビネットの反復を口で数えられる程度に覚える。", "最初の歌で強く聞こえる音節が、リフの頭と重なるか確かめる。", "ホーンが入る場面で、声・リフ・ホーンが同時に動く瞬間と隙間を分ける。"]}, {"id": "rec-012", "lessonId": "lesson-04", "tier": "C", "artist": "Michael Jackson", "title": "Rock With You", "version": "Off the Wall、アルバム版", "prompt": "滑らかな母音の手前で、子音は何をしているか。", "spotifyId": "3SJBhFjRWfAYqhPxJQQCkL", "youtube": {"id": "aCjxP58Ydik", "type": "公式音源"}, "searchUrl": "https://open.spotify.com/search/Michael%20Jackson%20Rock%20With%20You", "thesis": "流れるメロディーの中に、短いリズムの輪郭を探す。", "background": "1979年のアルバム『Off the Wall』に収録された曲です。教材ではライブや別ミックスを混ぜず、指定するアルバム版を基準にします。公式カタログでもアルバム収録を確認できます。", "analysis": "母音は旋律を運び、子音は言葉の輪郭を作ります。二つを分けて聴くと、滑らかなフレーズの中にも短い出来事が見つかります。声の高さを追う耳と、ドラムのように音の入りを追う耳を切り替えてみましょう。", "listens": ["最初のヴァースから最初のサビまでを一度聴き、伴奏の反復をつかむ。", "その中の一つの短いフレーズに絞り、言葉が始まる瞬間と、母音が続く時間を分けて追う。", "同じフレーズを伴奏ごと聴き、声が止まったあとに残るリズムを探す。"], "exercise": "原曲と無関係な自作の「まだまだ先へ」を一定の拍で言い、語尾を短くする版／長くする版を比べます。無理に息を足したり、本人の声の細さを作ったりする必要はありません。", "silent": "画面のグリッドに、子音の入りと語尾が終わる位置を別の印で置く。原曲の採譜として正誤を判定しません。", "pitfall": "歌手の特徴を、一つの息の音や掛け声だけで代表させない。繰り返す伴奏との関係も含めて聴く。", "question": "滑らかさを感じたのは母音、リズムを感じたのは子音だった？ 反対の場所もあった？", "scene": "最初の歌とサビの反復。滑らかな旋律の下にある子音、息、短い掛け声をリズムの層として聴く。", "points": ["最初の一行では母音だけを追い、旋律の流れを覚える。", "二度目は語頭の短い子音をドラムの位置と比べる。", "サビの主声と背景の声を分け、重ね声の厚みを一人の声量と取り違えない。"]}, {"id": "rec-013", "lessonId": "lesson-05", "tier": "A", "artist": "Marvin Gaye", "title": "What's Going On", "version": "What's Going On、アルバム版", "prompt": "主旋律のまわりの声が、距離感をどう変えるか。", "spotifyId": "7GDzf0MaVa1Jz6P25YrWSc", "youtube": {"id": "o5TmORitlKk", "type": "公式映像"}, "searchUrl": "https://open.spotify.com/search/Marvin%20Gaye%20What%27s%20Going%20On", "thesis": "主旋律のまわりの声が、距離感をどう変えるか。", "background": "", "analysis": "", "listens": ["冒頭から最初の一区切りを聴き、声量以外で、距離を近く感じさせたものは？", "主旋律のまわりの声が、距離感をどう変えるか。", "伴奏と一緒に聴き直し、最初の印象がどう変わるかをメモする。"], "exercise": "普段の声で短い一文を録り、語の区切りだけを変える。ささやき続ける練習は行わない。", "silent": "主声の近さと周囲の空間の広さを、別々の言葉で書く。", "pitfall": "聞こえた表現から、歌手の意図や身体の使い方を断定しない。", "question": "声量以外で、距離を近く感じさせたものは？", "scene": "冒頭の会話めいた声から主旋律、重なる返答へ。最初から声が一人だけとは限らない音の距離を聴く。", "points": ["歌が始まる前の話し声めいた層と、主旋律の距離を比べる。", "タイトルの句の周囲で、主声と重なった声の高さや入りを分ける。", "同じ句が戻る際、背景声や楽器が増えることで問いの印象が変わるか聴く。"]}, {"id": "rec-014", "lessonId": "lesson-05", "tier": "B", "artist": "Al Green", "title": "Let's Stay Together", "version": "Let's Stay Together、スタジオ版", "prompt": "フレーズ途中の声色の変化を一か所探そう。", "spotifyId": "6v74ocICYr6ZPn37zXFqt2", "youtube": {"id": "mYDLL6tOcUY", "type": "公式音源"}, "searchUrl": "https://open.spotify.com/search/Al%20Green%20Let%27s%20Stay%20Together", "thesis": "フレーズ途中の声色の変化を一か所探そう。", "background": "", "analysis": "", "listens": ["冒頭から最初の一区切りを聴き、声量以外で、距離を近く感じさせたものは？", "フレーズ途中の声色の変化を一か所探そう。", "伴奏と一緒に聴き直し、最初の印象がどう変わるかをメモする。"], "exercise": "普段の声で短い一文を録り、語の区切りだけを変える。ささやき続ける練習は行わない。", "silent": "主声の近さと周囲の空間の広さを、別々の言葉で書く。", "pitfall": "聞こえた表現から、歌手の意図や身体の使い方を断定しない。", "question": "声量以外で、距離を近く感じさせたものは？", "scene": "冒頭の高い入りから柔らかな低めのフレーズへ。同じ人の中で声色が切り替わることを、単語単位で追う。", "points": ["冒頭の高い音の質感と、続く言葉の低い位置を比べる。", "タイトルの句を一度目と次の反復で聴き、伸ばす長さと力の抜き方をメモする。", "ドラムとオルガンの上で、ささやくように聞こえる箇所がどう前に残るか確かめる。"]}, {"id": "rec-015", "lessonId": "lesson-05", "tier": "C", "artist": "Donny Hathaway", "title": "A Song for You", "version": "Donny Hathaway、スタジオ版", "prompt": "ピアノと言葉の間に、どれほど余白を残すか。", "spotifyId": "3kpA4mVTVLhzOycgODbAmn", "youtube": {"id": "riwePTnk-Zk", "type": "レーベル公式音源"}, "searchUrl": "https:/ 最初の印象がどう変わるかをメモする。"], "exercise": "これまでの自作素材で一つの条件だけ変え、二つの録音を比較する。歌わず、聴く観点だけ選んでも完了。", "silent": "未習の一曲を選び、三つの観察と一つの疑問を書く。", "pitfall": "聞こえた表現から、歌手の意図や身体の使い方を断定しない。", "question": "どの表現を、自分の歌や次の鑑賞に持ち帰りたい？", "scene": "静かな言葉から広いサビへ。声の強弱だけでなく、弦、ドラム、背景声が支える段階を分ける。", "points": ["最初の一文の語尾で、ピアノや弦がどれだけ残るか聴く。", "『Everything』の句の一度目と後半で、母音の長さと語頭の力を比べる。", "大きなサビの主声を追ったあと伴奏だけを意識し、広がりの役割を整理する。"]}, {"id": "rec-042", "lessonId": "lesson-14", "tier": "C", "artist": "Ado", "title": "うっせぇわ", "version": "2020年オリジナル配信版", "prompt": "声色の切り替わりを、場面と結びつけて整理しよう。", "spotifyId": "04TYwjYg02xvZHnDQHTqgJ", "youtube": {"id": "Qp3b-RXtz4w", "type": "公式映像"}, "searchUrl": "https://open.spotify.com/search/Ado%20%E3%81%86%E3%81%A3%E3%81%9B%E3%81%87%E3%82%8F", "thesis": "声色の切り替わりを、場面と結びつけて整理しよう。", "background": "", "analysis": "", "listens": ["冒頭から最初の一区切りを聴き、どの表現を、自分の歌や次の鑑賞に持ち帰りたい？", "声色の切り替わりを、場面と結びつけて整理しよう。", "伴奏と一緒に聴き直し、最初の印象がどう変わるかをメモする。"], "exercise": "これまでの自作素材で一つの条件だけ変え、二つの録音を比較する。歌わず、聴く観点だけ選んでも完了。", "silent": "未習の一曲を選び、三つの観察と一つの疑問を書く。", "pitfall": "聞こえた表現から、歌手の意図や身体の使い方を断定しない。", "question": "どの表現を、自分の歌や次の鑑賞に持ち帰りたい？", "scene": "語るような箇所、鋭い叫び、サビの反復。声色が次々変わるが、各場面で言葉をどう刺すかが違う。", "points": ["最初の語りに近い部分で、子音の短さと伴奏のリズムを比べる。", "『うっせぇわ』の反復で、語頭の圧、伸ばす母音、最後の切り方を一回ずつ追う。", "声色が急に変わる前後の楽器の密度を聴き、歌唱とミックスの両方が作る衝撃を分ける。"]}], "artists": [{"name": "Sam Cooke", "bio": "ゴスペル・グループSoul Stirrersを経て、ポップとソウルをつなぐ歌手・作曲家になった。『You Send Me』では大きな力を示すより、ひとつの旋律を自然な会話の長さに収める歌を聴ける。", "voice": "明るく滑らかな輪郭と、語尾で少し質感がほどける印象。一定の『甘い声』と決めず、音の頭と母音の終わりを分けて聴く。", "phrasing": "子音を強く打たずに言葉を前へ進め、長い母音で旋律を支える。繰り返しのたびに音を切る位置や勢いを比べたい。", "production": "50年代末のポップ録音として、主声と伴奏・コーラスの距離を聴く。声の温かさは歌唱だけでなく録音帯域や残響にも左右されるため、特定のマイクや処理は断定しない。", "listen": "最初の一語、伸ばす母音、最後の消え方を続けて聴き、どこで親密さを感じたか。", "sourceUrl": "https://rockhall.com/inductees/sam-cooke/", "engineering": "温かい主声を試すなら、伴奏を少し下げて中域の言葉を残し、短い残響とコーラスの距離を一つずつ比べる。", "recordingIds": ["rec-001"]}, {"name": "Carpenters", "bio": "KarenのリードとRichardの編曲・コーラス設計を軸に、70年代のポップで独自の音像を作った兄妹デュオ。ここでは旋律を歌う主声と、周囲の重なる声を別々に追う。", "voice": "Karenの低めで落ち着いた声域、息の輪郭、明瞭な言葉が入口。低さを単なる音程と捉えず、近くに感じる質感も比べる。", "phrasing": "大きな装飾よりも、語頭の置き方と音価の丁寧な調整で歌詞を運ぶ。フレーズ終端の短い余白も聴きどころ。", "production": "主声を中心に保ちつつ、多重コーラスや整えられた伴奏で奥行きを作るアレンジに耳を向ける。コーラスの厚みを主声そのものの声量と混同しない。", "listen": "リードだけを追ってから、同じ部分の背後の声を聴き、親密さと広がりがどこで切り替わるか。", "engineering": "主声は中央に置き、別録りのハーモニーを左右に薄く広げる。重ねる前後で子音の明瞭さがどう変わるかを聴く。", "recordingIds": ["rec-002"]}, {"name": "Norah Jones", "bio": "ピアノを弾き、ジャズ、カントリー、ポップをまたいで歌うシンガー・ソングライター。『Don't Know Why』では大きな劇的変化より、短い言葉が伴奏の拍と触れる位置を聴く。", "voice": "柔らかな輪郭と小さな音量変化を保つ声に注目。息っぽさという一語にまとめず、母音の芯と語尾の薄まり方を区別する。", "phrasing": "語句のまとまりを崩さず、拍の少し前後に言葉を置く。ピアノの間に声が入る瞬間と、声が抜けた後を比べる。", "production": "近い主声と比較的控えめな伴奏がつくる空間の設計を聴く。近さはマイク距離だけの証拠ではなく、音量、EQ、残響と編曲の組み合わせでも生じる。", "listen": "一つの語尾で声が消えた後、ピアノとドラムはどれだけ残って聞こえるか。", "engineering": "息や小さな強弱が見える音量から始め、圧縮を強くする前にピアノの帯域を整理する。近接効果と残響量を別々に試す。", "recordingIds": ["rec-003"]}, {"name": "Billie Holiday", "bio": "ジャズのスタンダードを、旋律の形と歌詞の意味の両方から読み替えた歌手。伴奏に対する言葉の位置を変え、同じ楽曲に別の時間感覚を与える点から入る。", "voice": "細い・太いだけでは捉えにくい、少しざらつく輪郭と語りに近い発音。録音年代による帯域の狭さを、生の声質そのものと同一視しない。", "phrasing": "拍に正確に重なるかより、どの語を残し、どの語を先へ急がせるかを聴く。間を取る位置が文の意味を変える。", "production": "古いモノラル録音の帯域、伴奏とのバランス、録音由来のノイズを念頭に置く。現代的な近接録音と同じ物差しで『声の粗さ』を比較しない。", "listen": "『All of Me』の一節を伴奏の拍だけ追ってから声に戻り、言葉の着地がどこにあるか。", "sourceUrl": "https://rockhall.com/inductees/billie-holiday/", "engineering": "現代的に録る実験では、広い帯域の明瞭さと古い録音に近い帯域制限を切り替え、フレーズの間がどう聞こえるか比べる。", "recordingIds": ["rec-004"]}, {"name": "Frank Sinatra", "bio": "ビッグバンド時代からアルバム文化まで長く活躍した歌手。スタンダードの歌詞を会話のような長さに切り、オーケストラの大きな動きと一人の言葉を結ぶ。", "voice": "密度のある中音域と、長い線を保ちながら言葉を明瞭にする響きが焦点。音量の大小だけでなく、子音の明瞭さと母音の連続性を聴く。", "phrasing": "伴奏の拍を踏みしめる箇所と、少し後ろへ残す箇所の差。長いフレーズの途中で息継ぎと意味の句読点がどう置かれるか。", "production": "ビッグバンドとリード声の前後関係、オーケストラが膨らむ瞬間の主声の見え方を聴く。マイク名より、ダイナミクスと編曲が親密さを保つ仕組みを考える。", "listen": "『I've Got You Under My Skin』後半で伴奏が厚くなる前後、言葉の聞き取りやすさはどう変わるか。", "engineering": "伴奏が大きくなる部分で自動化した音量と一定の圧縮を聴き比べる。語頭が自然に残る設定を探す。", "recordingIds": ["rec-005"]}, {"name": "Ella Fitzgerald & Louis Armstrong", "bio": "Ella FitzgeraldとLouis Armstrongという異なる声を一曲に並べた共演。二人を一人の歌手として扱わず、交互に現れるフレーズと一緒に歌う瞬間を分けて聴く。", "voice": "Ellaの明晰でしなやかな線と、Armstrongの粒立ち・ざらつきの対比。録音の帯域だけで判断せず、同じ曲の中での発音や音価を見る。", "phrasing": "互いの語尾を受けるタイミング、同じ旋律を歌ったときの子音と母音の長さに注目。違いが会話を作る。", "production": "二人の声とバンドの配置、主役が入れ替わるときのバランスを聴く。古い録音の定位や残響は現行配信の再発処理でも変わり得る。", "listen": "『Cheek to Cheek』の同じ言葉を二人が歌う場面で、拍への入り方を一つずつ書き分ける。", "engineering": "二つの声の音量と定位を一つずつ動かし、掛け合いの主役交代が分かる位置を探す。共通の部屋鳴りも試す。", "recordingIds": ["rec-006"]}, {"name": "Ray Charles", "bio": "ゴスペル、ブルース、ジャズをポピュラー音楽の歌へ接続し、ピアノと声でバンドを率いた音楽家。『I Got a Woman』では一人の声と応答する集団との関係が軸になる。", "voice": "ざらついた強い音だけでなく、短い呼びかけに含まれる柔らかな立ち上がりも聴く。声量を一定の性質として決めない。", "phrasing": "短く切る叫び、伸ばす母音、合いの手への受け渡し。伴奏やコーラスに隙間を渡すことで曲が動く。", "production": "主声、バンド、応答の距離とバランスを聴く。古い録音の飽和したような質感を、歌手一人の発声機構だけで説明しない。", "listen": "呼びかけの後に誰が返し、次の主声がどの拍で入るかを手で数える。", "sourceUrl": "https://rockhall.com/inductees/ray-charles/", "engineering": "主声と応答声を別の奥行きに置く。全体の質感を飽和させる前後で、語頭のリズムが失われないか確かめる。", "recordingIds": ["rec-007"]}, {"name": "Aretha Franklin", "bio": "ゴスペルを背景に持ち、ピアノ、歌、応答するコーラスを一つの表現へ組み合わせたソウルの歌手。『Respect』では主声と後ろの声の掛け合いが構造を作る。", "voice": "強く張る瞬間と、言葉を軽く置く瞬間の幅。大きな声を一枚岩として捉えず、音色が変わる場所を追う。", "phrasing": "語頭を押す、短く切る、相手の声を待つといった選択がリズムになる。コーラスの合いの手と主声の時間差を聴く。", "production": "主声、コーラス、ホーン、リズム隊が互いのスペースを残す編曲に注目。声の迫力には演奏とミックスのバランスも関わり、特定マイクを推定しない。", "listen": "『Respect』のタイトル語を主声だけ、応答だけ、全体の順に聴き、主役が移る箇所を探す。", "sourceUrl": "https://rockhall.com/inductees/aretha-franklin/", "engineering": "力のある高音を均一に押さえ込まず、声の音量変化とコーラスの応答を残す。ホーンと主声の中域の重なりを調整する。", "recordingIds": ["rec-008"]}, {"name": "Otis Redding", "bio": "メンフィスのソウルを代表する歌手。『Try a Little Tenderness』は静かな語りからバンドと一緒に熱量を上げる構成が鮮やかで、曲全体の弧を聴く教材になる。", "voice": "語りに近い抑えた声から荒い輪郭までの変化。最初と最後だけを比べず、途中で質感が変わり始める境目を見つける。", "phrasing": "短い語を急いで詰める後半と、余白を残す前半の対比。繰り返すフレーズでも終わりの長さが変わる。", "production": "ホーンやドラムが増すことで歌が大きく聞こえる関係を聴く。後半の高揚をボーカルの音量操作だけに帰さず、編曲と録音の密度を分ける。", "listen": "前半と終盤の同じ短い言葉を比べ、声、伴奏、間のどれが変わったか。", "sourceUrl": "https://rockhall.com/inductees/otis-redding/", "engineering": "主声の大きさだけを上げる場合と、ホーン・ドラムを厚くする場合を比べ、終盤の高揚をどちらが作るか聴く。", "recordingIds": ["rec-009"]}, {"name": "James Brown", "bio": "歌とバンドの拍を細かく噛み合わせ、ファンクの身体感覚を作った歌手・バンドリーダー。『I Got You (I Feel Good)』では旋律よりも声の長さと切れ目がリズムを動かす。", "voice": "鋭い語頭、短いシャウト、直後の余白。粗さだけを模倣せず、音の開始と停止の設計として聴く。", "phrasing": "ホーンの短い句と声の返答、ドラムの位置に注目。フレーズが少しでも長くなるとグルーヴの形がどう変わるか。", "production": "主声とホーンのアタックを並べて聴く。録音の歪みや密度があっても、音を切るリズムは残る。特定の歪み装置やコンプ設定は録音だけから特定できない。", "listen": "一回の『I feel good』で声の終わりと次のホーンの入りの間隔を数える。", "sourceUrl": "https://rockhall.com/inductees/james-brown/", "engineering": "短い語尾とホーンのアタックを揃えすぎずに置く。圧縮や飽和を足しても、語頭の輪郭が残るか確認する。", "recordingIds": ["rec-010"]}, {"name": "Stevie Wonder", "bio": "歌、鍵盤、作曲、編曲を横断して作品を作る音楽家。『Superstition』では鍵盤の反復と声が別々に動き、同じグルーヴの上で緊張を変える。", "voice": "粒立ちのある語頭と、節目で伸びる母音。旋律の高さだけでなく、声がリフへ近づく瞬間の輪郭を見る。", "phrasing": "反復する伴奏のどこへ子音を置き、どこで声を抜くか。短い装飾が次の拍へ向かう働きを聴く。", "production": "クラビネット、ドラム、管楽器などの層と主声の相対的な位置を追う。音が厚いところでも言葉が残る理由を、音量だけでなく帯域と編曲の隙間から考える。", "listen": "リフだけを数えた後、同じ二小節で声が拍を押す場所を印付けする。", "sourceUrl": "https://rockhall.com/inductees/stevie-wonder/", "engineering": "低音とクラビネットの密度を保ちながら、主声が見える中域を探す。背景声の幅を変えて、リードの位置を確かめる。", "recordingIds": ["rec-011"]}, {"name": "Michael Jackson", "bio": "Jackson 5からソロへ活動を広げ、歌・ダンス・映像・録音を一体にしたポップを作った歌手。『Rock With You』では滑らかなリードとリズムを刻む細かな声を両方聴ける。", "voice": "明るい輪郭と軽い語尾、時折入る小さな声のアタック。高い音域だけで特徴を説明せず、声がリズムへ変わる瞬間を見る。", "phrasing": "短い息や子音、フレーズの最後の抜き方がベースとドラムに絡む。流れる旋律の間にある細かな区切りを探す。", "production": "『Off the Wall』期の磨かれたリズム隊、コーラス、空間処理がリードを包む関係を聴く。多重録音の厚みと単独の主声の質感を分ける。", "listen": "歌の長い音を一度無視して、小さな子音と合いの手だけを追う。", "sourceUrl": "https://rockhall.com/inductees/michael-jackson/", "engineering": "主声の語頭、息、短い掛け声を別の層として扱い、重ね録りの前後でリズムの切れ味がどう変わるか比べる。", "recordingIds": ["rec-012"]}, {"name": "Marvin Gaye", "bio": "Motownの歌手として活動し、『What's Going On』では社会的な問いを含むアルバムを形にした。複数に重なる声が、一人の語りを会話のように広げる。", "voice": "柔らかな中音域、上へ抜ける声、話し声に近い断片が同じ曲に同居する。どれを主声として聴いているかを意識する。", "phrasing": "同じ言葉が少し違う時間で重なるところが焦点。即興的に聞こえる断片も、曲の流れの中で役割を持つ。", "production": "重なるリードや背景声、パーカッションと管の層が、声の距離を一つに固定しない。声の多重性を発声の特殊効果と誤解せず、録音・配置の選択として聴く。", "listen": "冒頭近くで主声と別の声が重なる箇所を選び、二人分の線として書いてみる。", "sourceUrl": "https://rockhall.com/inductees/marvin-gaye/", "engineering": "主声を複数回重ね、わずかなタイミング差や定位で奥行きを試す。単声に戻して感情の変化と音の厚みを区別する。", "recordingIds": ["rec-013"]}, {"name": "Al Green", "bio": "Hi Records期の作品で、強いビートの中に親密な歌を置いたソウル歌手。『Let's Stay Together』では語りかける距離から、短い高音へ移る変化を聴く。", "voice": "柔らかい話し声に近い音と、細く上がる声の対比。息が多いかだけでなく、母音の芯がどこに残るかを確認する。", "phrasing": "一語を急いで押さず、ドラムの裏側や弦の合間に置く。小さな装飾の行き先が歌詞のどこへ戻るか。", "production": "Hi Rhythm Sectionの反復と、近くに感じる主声の距離感を聴く。温かさは声だけでなく、伴奏の帯域、空間、音量差によっても生まれる。", "listen": "歌が高く抜けた直後、伴奏の同じ反復がどう聞こえ直すか。", "sourceUrl": "https://rockhall.com/inductees/al-green/", "engineering": "柔らかい主声を前に置き、低域やオルガンの量を変えて親密さを比較する。残響を足す前の乾いた声も聴く。", "recordingIds": ["rec-014"]}, {"name": "Donny Hathaway", "bio": "歌手、鍵盤奏者、編曲家としてソウルとジャズの境界で活動した。『A Song for You』では自分の言葉を探しているような、旋律と間の選択に耳を向ける。", "voice": "厚い中音域と、音を強める前の繊細な揺れ。声のざらつきや震えを単独の技術名へ還元せず、文脈の中で聴く。", "phrasing": "一文の途中でわずかに待つ、最後の語を長く置くなど、歌詞の重心を動かす。ピアノの音が消える時間とも比べる。", "production": "ピアノとリードが近く感じられる配置、弦や伴奏が広がる箇所を分ける。親密な印象を生声の距離だけで説明せず、音量と空間の作り方を聴く。", "listen": "最初の静かな一節と後半の大きな一節で、語尾が残る長さを比べる。", "engineering": "ピアノと主声の音量関係を固定してから、弦の広がりを増やす。音量自動化で静かな語尾をどう残せるか試す。", "recordingIds": ["rec-015"]}, {"name": "Rufus & Chaka Khan", "bio": "ファンク・バンドRufusと、そのリードを担ったChaka Khanの組み合わせ。『Ain't Nobody』では機械的に反復する伴奏の中で、声が柔軟に跳ねる対比を聴く。", "voice": "太く鋭い立ち上がりと、細い装飾へ移る幅。音量が大きい箇所だけでなく、低い語りの輪郭も比べる。", "phrasing": "シンセの反復に対して歌が前へ出たり、後ろへ残ったりする。短いメリスマの着地点を一つずつ確認する。", "production": "80年代のシンセ、ドラムの明確な反復と、前面に置かれた主声や背景声の関係を聴く。広がるコーラスの厚みを一人の喉の音量と混同しない。", "listen": "サビのタイトル語の前後で、主声とシンセのどちらが時間を引っ張るか。", "sourceUrl": "https://rockhall.com/inductees/chaka-khan/", "engineering": "強い主声の帯域をシンセやスネアと競合させず、背景声を広げる。圧縮を増やしても語尾のニュアンスが残るか聴く。", "recordingIds": ["rec-016"]}, {"name": "Whitney Houston", "bio": "ゴスペルに親しみ、ポップとR&Bの大きな旋律を歌った歌手。『I Have Nothing』では静かな言葉から長い高音へ進む構成を、伴奏の変化と一緒に聴く。", "voice": "密度のある中音域、明瞭な子音、伸びる高音の輪郭を分ける。大きな一音より、その前に音色を変える準備がどこから始まるかが重要。", "phrasing": "長い音へ向かう前の短い語、フレーズ末の余白を観察する。装飾は技巧の数でなく、文がどこへ着地するかから聴く。", "production": "バラードの主声を前に置き、弦・ドラム・背景声が段階的に厚くなる編曲。声の迫力とミックスの持ち上げ方を分け、特定の圧縮設定は推測しない。", "listen": "サビ直前とサビの最後で、主声だけでなく背後の音数がどう変わるか。", "sourceUrl": "https://rockhall.com/inductees/whitney-houston/", "engineering": "小さな入りと大きなサビを一律に潰さず、フレーズごとの音量調整と穏やかな圧縮を比べる。伴奏の増加も一緒に聴く。", "recordingIds": ["rec-017"]}, {"name": "Mariah Carey", "bio": "作詞・作曲にも関わる歌手。『Vision of Love』では一つの旋律を何度も変奏し、ポップ・バラードの枠内で装飾の行き先を作る。", "voice": "低めの静かな声、明るい高音、細い装飾の間を移動する。声域の広さという結果だけでなく、それぞれの音色の切り替わりを聴く。", "phrasing": "同じ旋律の再登場で母音の伸ばし方、音を足す場所、終わり方が変わる。まず骨格だけ口ずさみ、装飾を一つずつ戻すとわかりやすい。", "production": "リードが中央に残り、背景声や残響が周囲に広がるバラードの構図に注目。複数の声を一人の連続した歌唱と取り違えないようにする。", "listen": "一回目と最後のタイトル語を比べ、増えた音と伴奏の厚みを別に記録する。", "engineering": "主声と重ね声を別のトラックとして想定し、ハーモニーの定位と残響を変える。高音の明瞭さを背景声で覆わないか確かめる。", "recordingIds": ["rec-018"]}, {"name": "Prince", "bio": "作曲、演奏、歌、制作を横断し、ファンクとロックの境界を往復した音楽家。『Kiss』は少ない音数の中で、声とギターが前面のリズムを受け持つ。", "voice": "高く軽い声、短い叫び、低い語りが同じ曲に現れる。『裏声』という名称だけで片付けず、子音と音価に注目する。", "phrasing": "短いフレーズを切って空白を作り、ギターの一撃に受け渡す。休符の長さが変わると踊り方も変わる。", "production": "低音を詰め込みすぎない編曲と、中心の主声、配置を変える背景声に耳を向ける。声の変形をすべて機材由来と決めず、重ね録りと歌い分けも候補にする。", "listen": "声のない一拍を探し、その隙間でギターとドラムが何をしているか。", "sourceUrl": "https://rockhall.com/inductees/prince/", "engineering": "乾いた近い主声と、広がる背景声を対比する。声の歌い分けとフィルターや歪みの効果を一つずつ聴き分ける。", "recordingIds": ["rec-019"]}, {"name": "Jeff Buckley", "bio": "1994年のアルバム『Grace』を残した歌手・ギタリスト。ロックの大きな音量変化の中に、息の長い旋律と語りのような短い音を共存させる。", "voice": "薄く立つ音と、密度を増して張る音の差を聴く。高い音そのものより、高さに伴う輪郭の変化が教材の焦点。", "phrasing": "長い上行の終わりにどこで力を抜くか、バンドが強まる前後で母音がどう変わるか。装飾の入り口と出口を区別する。", "production": "ギターやドラムの広がる空間に対して主声がどの距離に残るかを追う。残響や二重声の印象があっても、特定の録音チェーンを推定しない。", "listen": "『Grace』で高さが上がる前後、声の強さ、音色、バンドの密度を三列でメモする。", "sourceUrl": "https://jeffbuckley.com/discography/grace/", "engineering": "静かな語尾から大きな高音までの幅を残し、残響を加える前後でギターとの距離感を比べる。", "recordingIds": ["rec-020"]}, {"name": "Minnie Riperton", "bio": "ソウルとポップを行き来した歌手で、高音域を含む独特の表現で知られる。『Lovin' You』は広い音域を誇示する曲としてだけでなく、静かな旋律の途中に違う質感が現れる曲として聴く。", "voice": "柔らかな中音域から非常に高い細い音へ移る対比。高音を健康な練習の目標にせず、音色が変化する聴取の対象とする。", "phrasing": "短い旋律の繰り返しで、母音の長さや高い装飾の置き場所を変える。歌の周囲の余白も表現の一部。", "production": "伴奏を詰めすぎず、高音と低い主声の両方が見える空間を聴く。倍音や残響の印象を、本人の声だけの成分と決めない。", "listen": "高い装飾の直前と直後で、低い声の語り口がどう戻るか。", "engineering": "高い声を強い高域ブーストだけで再現しようとせず、伴奏の帯域と声の音量から整理する。歯擦音も合わせて確かめる。", "recordingIds": ["rec-021"]}, {"name": "Queen", "bio": "Freddie Mercuryを中心に、多重コーラスと舞台的な展開を取り入れたロック・バンド。『Somebody to Love』ではリードの問いを大勢の声が受け、曲全体の規模を変えていく。", "voice": "Mercuryの張りのある主声と、重ねられた合唱の質感を分ける。合唱の厚みをリード一人の声質とみなさない。", "phrasing": "一人の呼びかけ、応答するコーラス、全員の強調が順に現れる。どの語が次の声を呼び込むかを聴く。", "production": "多重録音の合唱、左右や奥行きの配置、バンドとの重なりが重要な作品群。ここでは声の人数感と実際の録音人数を区別し、層が増える順番を追う。", "listen": "タイトル語をリード、背景声、全体の順に聴き、どこで舞台の広さが変わるか。", "sourceUrl": "https://rockhall.com/inductees/queen/", "engineering": "短い声部を複数回重ねて左右に配置し、人数感の変化を聴く。各声の子音が重なりすぎたら入りを調整する。", "recordingIds": ["rec-022"]}, {"name": "Led Zeppelin", "bio": "Robert Plantの声と、ギター・ベース・ドラムの強い対話で知られるロック・バンド。『Whole Lotta Love』ではリフと主声が競うだけでなく、空間的な効果が曲の一部になる。", "voice": "Plantの鋭い高音と、語頭の強い輪郭。歪んで聞こえる箇所を発声だけで説明せず、楽器と録音の飽和も分ける。", "phrasing": "リフに重ねる短い句と、リフから離れて伸びる叫びの差。伴奏の戻りで声がどこに着地するかを見る。", "production": "大きなドラム、ギターの密度、定位や残響が変わる中間部との対比を聴く。具体的な機材・テープ処理は資料なしで曲へ割り当てない。", "listen": "リフが消える区間の声の距離と、リフが戻った直後の距離を比べる。", "sourceUrl": "https://rockhall.com/inductees/led-zeppelin/", "engineering": "大きなドラムとギターの前後で主声を聴き、残響の長さと定位を変えて中間部の空間差を再現してみる。", "recordingIds": ["rec-023"]}, {"name": "Ike & Tina Turner", "bio": "Tina Turnerの強いリードを、バンドと大きな編曲の中に置いたデュオ／レビュー。『River Deep – Mountain High』では声の表現と増え続ける伴奏を同時に追う。", "voice": "Tinaの太くざらつく輪郭と、小さく始める語の差。強く聞こえることを単に高い音量と見なさず、アタックと伸ばし方を見る。", "phrasing": "曲の上昇に合わせて短い句を押し出す。伴奏が厚くなるときにも言葉の子音がどこに残るか。", "production": "大編成の密度、打楽器、背景声、残響に対してリードがどう見えるか。『Wall of Sound』という制作上の枠組みを、Tinaの発声技術の別名にしない。", "listen": "静かな冒頭と大きな終盤で、声そのものと伴奏の変化を別々に書く。", "engineering": "密度の高い伴奏に対して主声の中域を残し、背景声と残響の量を動かす。歪みだけを増やしても迫力が同じか確かめる。", "recordingIds": ["rec-024"]}, {"name": "Joni Mitchell", "bio": "作詞・作曲・演奏を担い、個人的な情景を独自の旋律と和声に結びつけた歌手。『A Case of You』では物語の細部と旋律の高さがどこで結びつくかを聴く。", "voice": "細く明るい輪郭と、語りへ戻る低い声の差。高音が意味の強調なのか、旋律の流れなのかを言葉ごとに考える。", "phrasing": "言葉の意味のまとまりが、小節線をまたいで進む。韻や子音の反復より、文の途中の間に耳を向ける。", "production": "比較的少ない伴奏の中で声が前へ出る印象を聴く。近さや透明感は編曲の隙間、音量、録音帯域にもよるため、マイクの型番を推測しない。", "listen": "一つの比喩が終わるまで、旋律と伴奏のどちらが先に一区切りを作るか。", "sourceUrl": "https://rockhall.com/inductees/joni-mitchell/", "engineering": "声と少数の楽器だけで距離を作る。伴奏を増やす前後、短い部屋鳴りを足す前後で言葉の近さを比較する。", "recordingIds": ["rec-025"]}, {"name": "Nina Simone", "bio": "クラシックの訓練を受けたピアニストであり、ジャズ、ブルース、フォークなどを横断した歌手。『Feeling Good』では低い語りから解放感のある広い音へ変わる構成を聴く。", "voice": "低く密度のある発音、言葉を語る時間、開く母音の差が焦点。『低音が魅力』だけでなく、一節の中で質感がどう動くかを見る。", "phrasing": "長い休止と、次の語の入りの組み合わせ。伴奏が待つ時間が語り手の態度を変える。", "production": "静かな入りと、管・リズム隊が広がる場面の差を聴く。声の迫力を常時の音量として捉えず、アレンジが作るコントラストを含めて考える。", "listen": "冒頭の一語とバンドが入った後の一語で、声の前後の空白を比べる。", "sourceUrl": "https://rockhall.com/inductees/nina-simone/", "engineering": "静かな語りを聴き取れる位置に置き、伴奏の増加に応じて音量を調整する。全体を同じ強さに圧縮しない実験をする。", "recordingIds": ["rec-026"]}, {"name": "David Bowie", "bio": "歌唱、演劇、キャラクター、編曲を往復しながら作品ごとに声の役割を変えた歌手。『Life on Mars?』では奇妙な物語と大きな音楽的展開が結びつく。", "voice": "会話に近い低めの語りから、輪郭を広げた高い声へ動く。『変身する声』を演技だけに還元せず、旋律と編曲の変化も見る。", "phrasing": "語句を急に押し出す箇所と、長い母音に預ける箇所の差。歌詞の場面転換と音の上昇がどこで重なるか。", "production": "ピアノ、弦、ドラムが段階的に大きくなる編曲の中で、主声の位置がどう保たれるか。残響とオーケストレーションによるスケール感を分ける。", "listen": "一節ごとに舞台の広さが変わったように感じる場所を、楽器の追加と一緒に探す。", "sourceUrl": "https://rockhall.com/inductees/david-bowie/", "engineering": "語る声を中央に保ちながら、ピアノから弦へ広がる伴奏の奥行きを動かす。残響量だけで壮大さを作れるか比べる。", "recordingIds": ["rec-027"]}, {"name": "D'Angelo", "bio": "90年代以降のR&Bで、鍵盤、グルーヴ、重なる声を密に結びつけてきた歌手・音楽家。『Brown Sugar』ではビートの反復に声が細かな揺れを与える。", "voice": "低めの柔らかな主声と、高く薄く重なる声の差。コーラスを一つの巨大な声として聴かず、層を解く。", "phrasing": "拍の前後に言葉を小さくずらし、同じ語を反復しても長さを変える。ドラムだけでなくベースとの時間差を見る。", "production": "多重ボーカル、鍵盤、低音が密度を作るR&Bの音像。前にある声と奥で響く声を聴き分け、グルーヴを単一のコンプ設定へ還元しない。", "listen": "同じ二小節を三回聴き、主声、背景声、ベースを順番に追う。", "engineering": "複数の声を重ねたときの音量とタイミング差を調整し、低音・ドラムの揺れと一緒に聴く。全トラックを機械的に揃えない。", "recordingIds": ["rec-028"]}, {"name": "Erykah Badu", "bio": "ジャズやヒップホップと関わるR&Bを独自の言葉と間で歌う音楽家。『On & On』ではゆっくりした循環の中で、旋律と語りの境目が動く。", "voice": "鼻にかかるような輪郭、軽い語尾、低い話し声に近い音を区別して聴く。声色の印象に名前を付けるより、どの単語で変わるかを探す。", "phrasing": "ビートの中心へ乗る音と、後ろに残る音。短い音節の繰り返しが文全体の流れをどこで変えるか。", "production": "反復するドラムと低音の上で、主声や背景のハーモニーを異なる距離に置く音像を聴く。揺れる時間感覚を『録音の遅延』と断定しない。", "listen": "同じリズムが続く八小節で、声だけが変えた位置を二つ記録する。", "engineering": "乾いた主声と奥のハーモニーを作り、残響と音量差を別々に変える。歌とビートの微妙なずれを残す設定を探す。", "recordingIds": ["rec-029"]}, {"name": "Lauryn Hill", "bio": "Fugeesでの活動とソロ作品で、歌とラップ、作詞、制作を結びつけた音楽家。『Ex-Factor』では一文を抑えて語る箇所と強く歌い上げる箇所がつながる。", "voice": "少しざらつく低めの語り、張った高音、重なる背景声を分ける。傷ついた感情を声の粗さだけで説明しない。", "phrasing": "一つの問いを言い切る前に間を作り、次の行で圧を増す。言葉の意味の切れ目とビート上の切れ目を比べる。", "production": "生楽器を感じさせる伴奏と重なる声の中で、リードの言葉が前へ出る位置を追う。コーラスの大きさを主声一人の音量の増加として聴かない。", "listen": "サビに向かう前後で、同じ語を主声と後ろの声がどう支えるか。", "sourceUrl": "https://www.grammy.com/artists/lauryn-hill/9621/", "engineering": "主声の語りと張った声で音量差を調整し、コーラスの幅を変える。ビートと生楽器が増えても言葉が残る帯域を確かめる。", "recordingIds": ["rec-030"]}, {"name": "Earth, Wind & Fire", "bio": "Maurice Whiteを中心に、複数の歌手、ホーン、リズム隊を統合したバンド。『Fantasy』は一人の歌だけではなく、リードと集団の重なりから聴く。", "voice": "軽く上がるリードと厚いハーモニーの対比。『バンドの声』を単独の歌手の声域として紹介せず、声部ごとに追う。", "phrasing": "リードの語尾へコーラスが入る場所、ホーンが空白を埋める場所。反復するリフの上で声の役割が変わる。", "production": "多層のコーラス、ホーン、弦、パーカッションが広い音像を作る。リードの明瞭さを音量だけでなく帯域と配置の隙間から考える。", "listen": "一番高い声を追い、その後で中間の声とベースだけを聴く。", "sourceUrl": "https://rockhall.com/inductees/earth-wind-and-fire/", "engineering": "複数の声を左右に配置し、ホーンと重なる中域を整理する。広がりを増してもリードの語頭が消えないか聴く。", "recordingIds": ["rec-031"]}, {"name": "Boyz II Men", "bio": "複数の主声とハーモニーを使い、90年代R&Bのバラードを代表するボーカル・グループ。『End of the Road』では誰が旋律を引き継ぎ、誰が和音の底を作るかが聴きどころ。", "voice": "低い支え、滑らかな中音、明るい高音を別々の声部として聴く。四人の和音を一人の広い声域として扱わない。", "phrasing": "ソロの問いを合唱が受け、同じ言葉の母音をそろえる。声の入れ替わりが曲の感情の向きを変える。", "production": "声部を重ね、定位と残響で広がりを作りながら、先頭の言葉を保つバラードの設計。多重録音の層と歌手の人数を混同しない。", "listen": "リードが交代した一箇所で、低い支えが続いているかを確認する。", "engineering": "各パートを単独で聴いてから重ね、低声と高声の音量・定位・残響を調整する。和音の明瞭さと一体感の両方を確かめる。", "recordingIds": ["rec-032"]}, {"name": "Imogen Heap", "bio": "歌、作曲、電子音響の制作を横断する音楽家。『Hide and Seek』は伴奏のほとんどを声と電子処理が担い、加工と旋律を同時に聴く入口になる。", "voice": "生の声の輪郭と、和音へ拡張されたように聞こえる声の境目を追う。電子的な成分をすべて本人の生声の声域とみなさない。", "phrasing": "歌詞の一区切りが新しい和音を呼ぶように聞こえる場所。言葉の長さと和声の変化を並べる。", "production": "声を入力として和音や質感を変化させる電子処理が作品の中心。『ボコーダー』など一つの機種名で済ませず、原声・処理声・重ね録りの聴き分けを試す。", "listen": "一つの母音を追い、音程以外の音が増える瞬間と消える瞬間を探す。", "sourceUrl": "https://imogenheap.com/", "engineering": "原声、ハーモニーを生成した声、加工した声を分けて試す。ピッチ補正、フィルター、重ね録りを一つずつ切り替える。", "recordingIds": ["rec-033"]}, {"name": "宇多田ヒカル", "bio": "作詞・作曲と歌を一体で展開してきた音楽家。『First Love』では日本語のまとまりと英語の短い語が、一つの旋律の中でどう異なる長さになるかを聴く。", "voice": "低めの言葉の輪郭と、上へ伸びる母音の繊細な変化。若い頃の録音を現在の歌唱スタイル全体の固定像にしない。", "phrasing": "日本語の助詞や語尾をどこまで一息で運ぶか。英語の一語へ移る前の間を含めて聴く。", "production": "ピアノやストリングスが厚くなるバラードの中でも、主声の子音がどう残るかを追う。残響や二重声の印象は版で変わり得るため、具体的な機材は割り当てない。", "listen": "日本語から英語に移る前後の母音の長さを記録する。", "sourceUrl": "https://www.utadahikaru.jp/", "engineering": "小さな息と語尾を残したまま、ピアノ・弦の中域を整える。残響を増やす前後で日本語の子音の見え方を比べる。", "recordingIds": ["rec-034"]}, {"name": "椎名林檎", "bio": "作詞・作曲・歌に加え、作品ごとの編曲や語り手の像を強く変える音楽家。『丸ノ内サディスティック』では言葉のリズムとバンドの跳ね方を合わせて聴く。", "voice": "鼻にかかるような輪郭、乾いた語尾、急に強まる発音の対比。単一の『癖』として片付けず、文のどこで選ばれるか。", "phrasing": "日本語と英語の音節をビートへ詰める場所、あえて引く場所。子音を打楽器として聴くと伴奏との関係がわかる。", "production": "歪んだ楽器、強いリズム隊、前景の声の距離を比べる。荒く感じる質感に歌唱、演奏、録音のどれが寄与するかは分けて考える。", "listen": "一節の語頭だけを聴き、スネアやギターと重なる位置を書き込む。", "sourceUrl": "https://www.kronekodow.com/", "engineering": "声の歪み、楽器の歪み、全体の飽和を別々に試す。語尾の演技が処理で埋もれない位置を探す。", "recordingIds": ["rec-035"]}, {"name": "玉置浩二", "bio": "安全地帯のボーカルとして、またソロ歌手・作曲家として活動。『メロディー』では派手な装飾より、ひとつの言葉をどの長さで残すかが曲の重心になる。", "voice": "太い中低音、語尾の細い揺れ、上へ開く音の差。『声量がある』という印象を、常に大きく歌っていることと混同しない。", "phrasing": "言葉の後に少し待ち、次の語へ急がない。伴奏がその余白をどう埋めるかを聴く。", "production": "少ない伴奏から広がる音像の中で、声の近さと残響の広がりを分ける。ライブ版とスタジオ版では間や距離の印象が大きく変わり得る。", "listen": "一つの『メロディー』を歌い終えた後、ピアノや弦の余韻を追う。", "sourceUrl": "https://www.sonymusic.co.jp/artist/KojiTamaki/", "engineering": "歌の強弱を音量自動化で支え、残響を短くした場合と長くした場合を比べる。静かな部分の近さを残す。", "recordingIds": ["rec-036"]}, {"name": "Billie Eilish", "bio": "FINNEASとの制作で、静かな声と大胆な音響的対比をポップの中心に置いた歌手。『when the party's over』では音数の少なさと声の層が強い効果を生む。", "voice": "小さな発音と、上へ伸びたときの薄い輪郭に注目。ささやくように聞こえることと、実際の呼気量や負担を同一視しない。", "phrasing": "音を押し出すより、語尾を消して次の空白を残す。反復する歌詞の中で小さなタイミングの変化を追う。", "production": "近く聞こえる主声、重なるハーモニー、静けさと低域のコントラストを聴く。制作で多重録音や加工が使われても、聞こえる親密さをマイク一本の効果と決めない。", "listen": "同じ短い語の一回目と次の反復で、背景に何声増えたように聞こえるか。", "sourceUrl": "https://www.grammy.com/news/meet-first-time-grammy-nominee-finneas-billie-eilish-doing-production-no-ones-ever-done/", "engineering": "小さな主声の息や子音を残し、低域の大きさと背景の重ね声を別に調整する。近さを得るための過度な圧縮を避ける。", "recordingIds": ["rec-037"]}, {"name": "Bon Iver", "bio": "Justin Vernonを中心とするプロジェクト。『Woods』は『Blood Bank』EPに収録され、声の重なりと電子的な音色変化そのものが編曲を担う。", "voice": "一人の声から和音へ広がる印象、揺れる音程の輪郭を聴く。処理された音を生身の声帯の音程移動だと断定しない。", "phrasing": "短い言葉を繰り返し、そのたびに音の厚さと和音の行き先を変える。言葉の意味より先に音色が届く瞬間もある。", "production": "多重声とピッチ処理の質感を聴く。『Auto-Tuneだけ』という説明で完結させず、歌のテイク、声の層、響きの配置を分ける。", "listen": "最初の一声と後半の同じ語を比べ、増えた声部と変わった音色を別々に記録する。", "sourceUrl": "https://boniver.org/audio/blood-bank/", "engineering": "素の歌、重ね声、ピッチ加工声を順に聴き、どの層が和声と質感を担うか確かめる。処理量だけで表現を説明しない。", "recordingIds": ["rec-038"]}, {"name": "Daft Punk", "bio": "フランスの電子音楽デュオ。『Something About Us』では機械的な反復の中に控えめな歌が置かれ、電子処理された声を親密に聞かせる設計がある。", "voice": "フィルターを通したような丸い輪郭と、言葉の少ない抑揚。聞こえる音色を歌い手の生声の固有特性とは扱わない。", "phrasing": "短い言葉を同じように繰り返し、和音とベースの変化によって意味を少しずつ変える。声が引く場所にも注目。", "production": "電子的な音色加工、反復する低音とドラム、狭く感じる声の帯域を聴く。特定のボコーダー・フィルターの機種は資料なしに指定しない。", "listen": "声の高さがほぼ変わらない場所で、和音が変わるだけで情感がどう動くか。", "engineering": "声をフィルターやボコーダーで処理する前後で言葉の明瞭さを比べる。反復するリズムに対する声の位置も動かす。", "recordingIds": ["rec-039"]}, {"name": "山下達郎", "bio": "シンガー・ソングライター、編曲家、プロデューサー。『RIDE ON TIME』ではバンドの推進力と、伸びる主声・重なるコーラスの関係を聴く。Spotifyでは本人の対象録音を特定できていない。", "voice": "明るく抜ける主声と、重ねた声の厚みを分ける。高い音の強さを一人の声量だけでなく、コーラスと楽器の支えの中で捉える。", "phrasing": "ビートの前へ出る短い子音と、長く伸びる母音の交互の配置。サビへ進むときの息の長さを聴く。", "production": "層を重ねたコーラス、タイトなリズム隊、前面に残る主声という設計を聴く。本人の版を確認するまで、Spotify検索のカバーや別版を教材の証拠に使わない。", "listen": "原曲を入手できたら、サビの主声だけから背景の声へ耳を移し、和音の厚みを数える。", "sourceUrl": "https://www.tatsuro.co.jp/discography/", "engineering": "別録りのコーラスを重ね、各声部の子音と音量を調整する。主声を中央に残したまま左右の幅を変えて聴く。", "recordingIds": ["rec-040"]}, {"name": "MISIA", "bio": "R&Bと大きなバラードを横断する歌手。『Everything』では長いフレーズの中で、小さな言葉から広い高音へ到達する道筋を聴く。", "voice": "密度のある中音域、輪郭の明るい高音、長い母音の変化。音域の広さという結果に加え、子音から母音へ移る瞬間を聴く。", "phrasing": "サビの同じ言葉を繰り返すたびに、伸ばす場所、装飾の着地点、語尾の残し方が変わる。", "production": "ストリングスや背景声が広がるバラードの中で主声がどこまで前に残るか。リミックスやライブ版と音の奥行きが異なるため、教材の候補版を確認する。", "listen": "タイトル語の一回目と最後を比べ、声、背景声、弦の変化を三つに分ける。", "sourceUrl": "https://www.misia.jp/musiclist/12051", "engineering": "広い強弱を持つ主声に対して弦と背景声を段階的に加える。サビだけを持ち上げる場合と全体を圧縮する場合を比べる。", "recordingIds": ["rec-041"]}, {"name": "Ado", "bio": "録音作品でさまざまな語り手を演じ分ける歌手。『うっせぇわ』では強い言葉だけでなく、低い語り、鋭い子音、高い叫びが場面ごとに役割を変える。", "voice": "低い語り、硬い輪郭、荒く聞こえる高音の切り替え。聞こえる歪みを身体の特定動作と即断せず、録音・処理も候補に入れる。", "phrasing": "言葉を詰める箇所、突然止める箇所、次の拍で爆発する箇所を追う。声色の切り替えが語り手の態度を変える。", "production": "現代的な高密度の編曲で、声が前へ出るための帯域、音量、重ね声、歪みの聴感を考える。特定プラグインや収録方法はクレジットなしに断定しない。", "listen": "同じフレーズの低い語りと強い声を比べ、子音・母音・背景音の変化を分離する。", "sourceUrl": "https://www.universal-music.co.jp/ado/", "engineering": "声色が急に切り替わる箇所をフレーズごとに整え、歪み・重ね声・空間処理を個別に試す。強い編曲でも言葉の輪郭を残す。", "recordingIds": ["rec-042"]}], "comparisons": [{"title": "声を近く感じる", "recordingIds": ["rec-001", "rec-003", "rec-037"], "question": "声そのもの、言葉、録音のどこが距離感に関わる？"}, {"title": "拍と自由に付き合う", "recordingIds": ["rec-004", "rec-028", "rec-029"], "question": "子音・母音・語尾のどれを基準にすると位置が見える？"}, {"title": "声が打楽器になる", "recordingIds": ["rec-010", "rec-011", "rec-035"], "question": "音を切ったあとの空白は、伴奏に何を渡す？"}, {"title": "一語を長く旅する", "recordingIds": ["rec-018", "rec-020", "rec-041"], "question": "装飾の途中を省くと、どんな骨格が残る？"}, {"title": "声が集まって場面になる", "recordingIds": ["rec-022", "rec-031", "rec-032"], "question": "リード以外の声は、支え・応答・旋律のどれを担う？"}, {"title": "声と加工の境目", "recordingIds": ["rec-033", "rec-038", "rec-039"], "question": "聞こえる効果と、作り方について分かっている事実を分けられる？"}], "labs": [{"id": "lab-01", "title": "マイクとの距離を変える", "paragraphs": ["同じ短い自作素材を、同じマイクに対して近い位置と少し離れた位置で録る。距離以外の条件をできるだけそろえ、後から再生音量を合わせて比較しよう。指向性マイクでは距離が低域の聞こえ方にも影響する場合がある。スマホは自動処理が入ることもあるので、その結果をすべて発声の変化と考えない。[S2]", "**観察：** 言葉の輪郭／低い成分／周囲の音。**初期値例：** 外部マイクで10cmと20cm。機種の推奨範囲で調整し、ライブ時の万能な距離としては扱わない。"]}, {"id": "lab-02", "title": "入力の余裕と、聞き取りやすいモニター", "paragraphs": ["入力ゲインとヘッドホン音量を別々に扱おう。大きく聞こえないからといって入力を上げ続けると、録音が割れることがある。まず短い素材でクリップ表示を確認する。自分の声が聞こえにくい場合も、無理に声を張る前に伴奏とのバランスを調整する。", "**観察：** 録音の歪み／伴奏に埋もれる言葉。**設定値：** 万能なピーク値は指定せず、使用機材のメーターと取扱説明に合わせる。"]}, {"id": "lab-03", "title": "EQは、何を前に出す？", "paragraphs": ["同じ録音で一つの帯域だけを少し変え、音量を合わせて戻してみる。変えた直後の派手さではなく、言葉が聴き取りやすくなったか、ほかの楽器と共存するかを判断する。声の太さを削りすぎたら元へ戻そう。", "**実験初期値：** 広い範囲を±2dB程度。周波数は対象素材に合わせて選ぶ。低域を一律に削るテンプレートは作らない。機能の読み方は使用DAWの公式資料で確認する。[S3]"]}, {"id": "lab-04", "title": "コンプと音量調整", "paragraphs": ["コンプレッサーは設定した条件に応じて音量変化を抑える処理。短い声の頭と長い母音で効き方が違うかを聴こう。音量を手で整える操作との役割の違いも試す。[S3]", "**実験初期値：** Ratio 2:1、強い箇所で1〜3dB程度のゲインリダクションを起点にする。Attack／Releaseは機種の穏やかなプリセットを基準とし、声の頭と語尾を聴いて一つずつ変える。これは編集者が提案する比較条件で、原曲の設定ではない。"]}, {"id": "lab-05", "title": "歯擦音を残す・抑える", "paragraphs": ["子音は言葉を伝える一部だが、録音で一部が強く目立つ場合もある。歯擦音を扱う処理を使うときは、全体を鈍くしていないかを元音と比べよう。周波数や効き具合は声・マイク・処理方式で変わる。", "**実験：** 機材のDe-esserを最小限から加え、同じ子音とそれ以外の母音を交互に聴く。具体操作は選んだ機材の公式マニュアルに対応させる。未調査の機種の操作手順は公開しない。"]}, {"id": "lab-06", "title": "残響の長さと始まるタイミング", "paragraphs": ["残響が多いことと、声が遠いことを分けて考えよう。元の声が止まったあとの尾、言葉の頭の見え方に注目して比較する。プリディレイは直接音から残響が始まるまでの時間を扱うパラメータ。[S2]", "**実験初期値：** 同じ短いリバーブでプリディレイ0ms／30msを比較する。次に長さだけ変える。最適値ではなく違いを聴くための条件で、原曲への処方ではない。"]}, {"id": "lab-07", "title": "ダブルとハーモニー", "paragraphs": ["自作の短いフレーズを二回録り、二つを重ねてみよう。同じ波形を複製する場合との違いを聴き、別テイクの細かな差がどう聞こえるかを確認する。ダブル、別旋律のハーモニー、左右への配置は別の操作として試す。", "**観察：** 一人らしさ／広がり／言葉の明瞭さ。**発展：** モノで聴き、広がりを減らしたときに何が残るか比較する。"]}, {"id": "lab-08", "title": "声を素材として加工する", "paragraphs": ["音の高さを扱う処理、声の輪郭を変える処理、別の音を声の動きで形づくる処理は、同じ「加工」でも異なる。まず一つずつ聴こう。機材の名称から録音の作り方を逆算せず、確認できる資料と自分の実験を分ける。[S3]", "**観察：** 言葉の明瞭さ／高さ／質感。**発展候補：** Pitch correction、Formant、Vocoder、Harmony。操作は対応機材を決めてから追記する。"]}], "glossary": [{"term": "ピッチ", "meaning": "音の高さ。装飾や揺れを含めて、どこへ向かうかも聴こう。"}, {"term": "リズム", "meaning": "音が始まり、続き、止まる時間の関係。"}, {"term": "フレーズ", "meaning": "音や言葉が一まとまりとして感じられる単位。"}, {"term": "アタック", "meaning": "音の始まりの輪郭。硬い、丸いなどの印象を具体的な場面で確かめよう。"}, {"term": "リリース", "meaning": "この教材では声を終える瞬間の扱い。コンプのReleaseとは文脈が異なる。"}, {"term": "母音／子音", "meaning": "言葉を作る音の種類。歌では母音の持続と子音の位置を分けて聴ける。"}, {"term": "アクセント", "meaning": "音量だけでなく長さや高さなどによって目立つ部分。"}, {"term": "シンコペーション", "meaning": "拍の強弱の予想をずらすようなリズムの働き。"}, {"term": "バックビート", "meaning": "一般的な4拍子では主に2拍目と4拍目の強調。"}, {"term": "レイドバック", "meaning": "拍に対して後ろ寄りに感じる時間の扱い。何を基準に感じたかも記録する。"}, {"term": "音価", "meaning": "音の長さ。歌では母音の持続と語尾の終わりを確認しよう。"}, {"term": "メリスマ", "meaning": "一つの音節に複数の音高を置く歌い方。"}, {"term": "ビブラート", "meaning": "音の高さなどが周期的に揺れて聞こえる表現。速さや現れる場所を観察する。"}, {"term": "ポルタメント", "meaning": "ある高さから別の高さへ、連続的につないで聞かせる表現。"}, {"term": "声区・レジスター", "meaning": "声の出方を整理する概念。教材では用語だけで本人の身体動作を決めない。"}, {"term": "ファルセット", "meaning": "高めの軽い声などを指して使われる用語。流派や文脈の用法を確認する。"}, {"term": "ミックスボイス", "meaning": "指導法によって意味や説明が異なる言葉。単一の身体操作として説明しない。"}, {"term": "ベルト", "meaning": "主に強く明瞭な歌唱表現を指す用語。教材では独学で押し出す手順に置き換えない。"}, {"term": "コール＆レスポンス", "meaning": "呼びかけと応答。声同士でも、声と楽器の間でも起こる。"}, {"term": "ダブル", "meaning": "同じパートを別テイクなどで重ねる制作手法。"}, {"term": "ハーモニー", "meaning": "複数の音の関係。コーラスでは主旋律と別の音をどう重ねるかを見る。"}, {"term": "EQ", "meaning": "周波数ごとの音量バランスを調整する処理。"}, {"term": "コンプレッサー", "meaning": "設定条件に応じて音量変化を抑える処理。"}, {"term": "リバーブ／ディレイ", "meaning": "音の残響を作る処理／遅れてくる音を作る処理。"}, {"term": "フォルマント", "meaning": "声の共鳴に関係するスペクトル上の特徴。ピッチと同じ意味ではない。"}], "playlist": null, "verifiedDetailedCount": 3};

const LESSONS=new Map(COURSE.lessons.map(x=>[x.id,x]));
const RECORDINGS=new Map(COURSE.recordings.map(x=>[x.id,x]));
const ARTISTS=new Map(COURSE.artists.map(x=>[x.name,x]));
const $=(q,root=document)=>root.querySelector(q);
const $$=(q,root=document)=>[...root.querySelectorAll(q)];
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const smallMd=value=>esc(value).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const blank=()=>({lessonCompleted:{},recordingObserved:{},notes:{},lastLessonId:'lesson-01',learningMode:'listen',updatedAtByField:{}});
let state=blank(),brokenRaw=null,storageError=false;
let activeHash='';

function validState(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('保存データの形式が不正です');
  const clean=blank();
  for(const [key,allowed] of [['lessonCompleted',LESSONS],['recordingObserved',RECORDINGS]]){
    const data=raw[key]??{};
    if(!data||typeof data!=='object'||Array.isArray(data))throw Error(key+'が不正です');
    for(const [id,value] of Object.entries(data))if(allowed.has(id)){
      if(typeof value!=='boolean')throw Error(key+'の値が不正です');
      clean[key][id]=value;
    }
  }
  const notes=raw.notes??{};
  if(!notes||typeof notes!=='object'||Array.isArray(notes))throw Error('メモが不正です');
  for(const [key,value] of Object.entries(notes)){
    if(!/^(lesson:lesson-\d{2}|recording:rec-\d{3}|comparison:comparison-\d{2})$/.test(key))continue;
    const [kind,id]=key.split(':');
    if((kind==='lesson'&&!LESSONS.has(id))||(kind==='recording'&&!RECORDINGS.has(id))||(kind==='comparison'&&(!Number(id.slice(-2))||Number(id.slice(-2))>COURSE.comparisons.length)))continue;
    if(typeof value!=='string'||value.length>20000)throw Error('メモの値が不正です');
    clean.notes[key]=value;
  }
  if(LESSONS.has(raw.lastLessonId))clean.lastLessonId=raw.lastLessonId;
  if(['listen','sing'].includes(raw.learningMode))clean.learningMode=raw.learningMode;
  const stamps=raw.updatedAtByField??{};
  if(stamps&&typeof stamps==='object'&&!Array.isArray(stamps))for(const [key,value] of Object.entries(stamps)){
    if(key.length<=80&&typeof value==='string'&&value.length<=40)clean.updatedAtByField[key]=value;
  }
  return clean;
}
function fromStorage(){const raw=localStorage.getItem(STORAGE_KEY);return raw===null?blank():validState(JSON.parse(raw))}
try{state=fromStorage()}catch(error){try{brokenRaw=localStorage.getItem(STORAGE_KEY)}catch(_){}storageError=true}
function message(text){const box=$('#message');box.hidden=false;box.textContent=text}
function updateStatus(text){$('#save-indicator').textContent=text}
function save(kind,id,value){
  state[kind][id]=value;
  const stamp=new Date().toISOString();state.updatedAtByField[kind+'.'+id]=stamp;
  try{
    if(brokenRaw!==null)throw Error('保存済みデータが壊れています');
    const latest=fromStorage();
    latest[kind][id]=value;latest.updatedAtByField[kind+'.'+id]=stamp;
    if(kind==='lessonCompleted'||kind==='notes'&&id.startsWith('lesson:'))latest.lastLessonId=kind==='lessonCompleted'?id:id.slice(7);
    if(kind==='recordingObserved')latest.lastLessonId=RECORDINGS.get(id).lessonId;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(latest));state=latest;
    storageError=false;updateStatus('この端末に保存済み');
  }catch(error){storageError=true;updateStatus('保存に失敗');message('ブラウザに保存できません。入力はこの画面に残っています。「記録」からバックアップできます。')}
  updateProgress();
}
function saveMode(mode){
  state.learningMode=mode;

  render();
}
function updateProgress(){const count=Object.values(state.lessonCompleted).filter(Boolean).length;$('#course-progress').value=count;$('#progress-text').textContent=count+' / '+COURSE.lessons.length;$$('.lesson-link').forEach(a=>{const done=$('.done',a);if(done)done.textContent=state.lessonCompleted[a.dataset.lesson]?'✓':''})}

function download(filename,contents,type){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function exportJSON(){download('vocal-listening-lab-backup.json',JSON.stringify({format:'vocal-listening-lab',version:1,courseId:COURSE.id,exportedAt:new Date().toISOString(),state},null,2),'application/json;charset=utf-8');message('学習済み・曲の記録・メモをJSONで書き出しました。')}

async function importJSON(file){
  if(!file)return;
  try{
    if(file.size>2000000)throw Error('2MBを超えています');
    const payload=JSON.parse(await file.text());
    if(payload.format!=='vocal-listening-lab'||payload.version!==1||payload.courseId!==COURSE.id)throw Error('この教材の対応したJSONではありません');
    const candidate=validState(payload.state);
    const l=Object.values(candidate.lessonCompleted).filter(Boolean).length;
    const t=Object.values(candidate.recordingObserved).filter(Boolean).length;
    const n=Object.keys(candidate.notes).length;
    if(!window.confirm(`バックアップで現在の記録を置き換えますか？\n学習済み${l}回／曲の記録${t}件／メモ${n}件\n現在の記録を残す場合は先にバックアップしてください。`))return;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(candidate));state=candidate;brokenRaw=null;storageError=false;
    render();updateStatus('復元済み');message('バックアップから復元しました。');
  }catch(error){message('復元できませんでした：'+error.message+'。現在の記録は変更していません。')}
  finally{$('#import-file').value=''}
}

function labPage(sound){const items=sound?COURSE.labs:COURSE.lessons.map(l=>({id:l.id,title:l.title,paragraphs:[l.exercise,'声を出さない課題：'+l.silent]}));return `<article><span class="eyebrow">${sound?'RECORDING LAB':'VOICE LAB'}</span><h1>${sound?'録音の実験室':'短く試す、声を聴く'}</h1><p class="lead">${sound?'マイク、コンプ、空間、重ね録り。条件を一つだけ変えて、聞こえ方を比べましょう。':'歌うことは任意。原曲のキーや声色を再現せず、短い自作の言葉で違いを確かめます。'}</p><div class="card"><h2>声を使わないモード</h2><p>各レッスンに聴いて進める課題があります。今日は声を出さずに進めるなら、<button type="button" class="button-secondary" data-mode="listen">聴くモードにする</button></p><p class="muted">痛みや声がれがあるときは歌わずに休み、症状が続く場合は耳鼻咽喉科へ相談してください。</p></div>${items.map((x,i)=>`<section class="card lab-card"><span class="eyebrow">${sound?'SOUND LAB':'LESSON'} ${String(i+1).padStart(2,'0')}</span><h2>${esc(x.title)}</h2>${x.paragraphs.map(p=>`<p>${smallMd(p)}</p>`).join('')}${!sound?`<a href="#${x.id}">レッスンへ →</a>`:''}</section>`).join('')}</article>`}
function foundationsPage(){return `<article><span class="eyebrow">FOUNDATIONS</span><h1>基礎と用語</h1><p class="lead">名前を覚える前に、聴く場所を一つ決める。分からない言葉だけ、その都度戻って読めます。</p><div class="feature-grid">${[['リズム','歌の入り、止まる位置、伴奏との関係。'],['言葉','子音、母音、意味のまとまり。'],['声と録音','声色、強弱、重なり、空間。']].map(([h,p])=>`<div class="feature"><h3>${h}</h3><p>${p}</p></div>`).join('')}</div><h2 style="margin-top:30px">用語索引</h2><dl class="glossary-list">${COURSE.glossary.map(g=>`<div><dt>${esc(g.term)}</dt><dd>${esc(g.meaning)}</dd></div>`).join('')}</dl></article>`}
function sourcesPage(){return `<article><span class="eyebrow">SOURCES & RECORDINGS</span><h1>資料と録音版</h1><p class="lead">歴史・人物・機材についての事実と、私たちが提案する聴き方は区別しています。</p><div class="card"><h2>動画と録音版の扱い</h2><p>各曲のサムネイルは、その曲カードで開くYouTube動画と同じ動画IDから表示します。公式アーティスト・レーベルの音源を優先し、公式映像を使う曲もあります。映像版、再発、リマスター、別ミックスでは教材で想定した録音と音が異なる場合があります。各カードの「動画」欄で種類を確認してください。</p><p>山下達郎「RIDE ON TIME」は本人音源と題された第三者投稿を候補としています。公開元と収録版は未確認です。YouTubeの再生可否は地域、権利設定、ブラウザで変わるため、再生できない場合は外部リンクとSpotifyの候補も試せます。</p><p>Spotifyの41曲は個別の候補トラックへ、残る1曲は検索へ案内しています。</p></div><div class="card"><h2>資料</h2><ul class="source-list"><li><a href="https://www.nidcd.nih.gov/health/taking-care-your-voice" target="_blank" rel="noopener noreferrer">NIDCD — 声のケア</a></li><li><a href="https://www.shure.com/en-US/insights/how-to-record-and-mix-vocals" target="_blank" rel="noopener noreferrer">Shure — 声の録音とミックス</a></li><li><a href="https://billieholiday.com/bio/" target="_blank" rel="noopener noreferrer">Billie Holiday公式紹介</a></li><li><a href="https://rockhall.com/inductees/sam-cooke/" target="_blank" rel="noopener noreferrer">Sam Cooke — Rock Hall</a></li><li><a href="https://rockhall.com/inductees/aretha-franklin/" target="_blank" rel="noopener noreferrer">Aretha Franklin — Rock Hall</a></li></ul><p>曲ごとの詳細な根拠と未確定項目は<a href="https://github.com/chanwata/vocal-study/tree/main/docs" target="_blank" rel="noopener noreferrer">設計・編集資料</a>に記載しています。</p></div></article>`}
function dataPage(){const l=Object.values(state.lessonCompleted).filter(Boolean).length,r=Object.values(state.recordingObserved).filter(Boolean).length,n=Object.keys(state.notes).filter(k=>state.notes[k].trim()).length;return `<article><span class="eyebrow">YOUR NOTES</span><h1>記録とバックアップ</h1><p class="lead">進捗とメモは、この端末・このブラウザに保存します。別端末への自動同期はありません。</p><div class="data-grid"><div><b>${l}</b><small>学習済み回</small></div><div><b>${r}</b><small>曲の記録</small></div><div><b>${n}</b><small>メモ</small></div></div><div class="card"><h2>データを持ち出す</h2><p>JSONには学習済みとメモのすべてが入り、別のブラウザに復元できます。TXTはメモを読むためのファイルです。</p><div class="actions"><button class="button" type="button" data-action="export-json">JSONバックアップを保存</button><button class="button-secondary" type="button" data-action="export-txt">メモをTXTで保存</button></div></div><div class="card"><h2>別端末から復元</h2><p>JSONファイルを選び、内容の件数を確認してから現在の記録と置き換えます。</p><button class="button-secondary" type="button" data-action="import">JSONから復元</button></div>${brokenRaw!==null?`<div class="card"><h2>保存済みデータを読み込めません</h2><p>元データを保持しています。まず原文を退避してから、空の記録でやり直せます。</p><div class="actions"><button class="button-secondary" data-action="raw-backup">元データを書き出す</button><button class="button-secondary" data-action="reset">この端末の記録を初期化</button></div></div>`:''}<div class="recording-note">ブラウザのサイトデータを消すと記録も消えることがあります。時々JSONバックアップを保存してください。</div></article>`}
function render(){
  const hash=location.hash||'#home';activeHash=hash;
  const match=hash.match(/^#(lesson-\d{2})(?:\/recording\/(rec-\d{3}))?$/);
  let html;
  if(match&&LESSONS.has(match[1]))html=lessonPage(LESSONS.get(match[1]));
  else if(hash==='#home')html=homePage();else if(hash==='#recordings')html=recordingsPage();else if(hash==='#artists')html=artistsPage();
  else if(hash==='#compare')html=comparePage();else if(hash==='#voice-lab')html=labPage(false);else if(hash==='#sound-lab')html=labPage(true);
  else if(hash==='#foundations')html=foundationsPage();else if(hash==='#sources')html=sourcesPage();else if(hash==='#data')html=dataPage();
  else {location.hash='#home';return}
  $('#content').innerHTML=html;
  document.title=(match?LESSONS.get(match[1]).title:$('#content h1')?.textContent||'声を聴く')+' — VOCAL LISTENING LAB';
  const navHash=match?'#'+match[1]:hash;
  $$('.lesson-link,.other-link,.mobile-tabs a').forEach(a=>{const on=a.getAttribute('href')===navHash;a.classList.toggle('active',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('.sidebar').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false');$('#menu-toggle').innerHTML='目次を開く <span aria-hidden="true">＋</span>';
  updateProgress();if(storageError)updateStatus('保存に失敗');
  if(match&&match[2]){const card=$('#'+match[2]);if(card)requestAnimationFrame(()=>card.scrollIntoView({block:'start'}))}else window.scrollTo(0,0);
}

document.addEventListener('click',event=>{
  const videoButton=event.target.closest('[data-youtube]');
  if(videoButton){const id=videoButton.dataset.youtube;if(!/^[A-Za-z0-9_-]{11}$/.test(id))return;const frame=document.createElement('iframe');frame.title=videoButton.getAttribute('aria-label');frame.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;frame.referrerPolicy='strict-origin-when-cross-origin';frame.className='youtube-frame';videoButton.replaceWith(frame);return}
  const button=event.target.closest('[data-action],[data-mode]');if(!button)return;
  const action=button.dataset.action;
  if(action==='export-json')exportJSON();else if(action==='export-txt')exportTXT();else if(action==='import')$('#import-file').click();
  else if(action==='raw-backup'&&brokenRaw!==null)download('vocal-listening-lab-unreadable-data.txt',brokenRaw,'text/plain;charset=utf-8');
  else if(action==='reset'&&window.confirm('この端末に保存されている破損データを初期化しますか？ 元データは先に書き出せます。')){try{localStorage.removeItem(STORAGE_KEY);brokenRaw=null;storageError=false;state=blank();render();message('この端末の記録を初期化しました。')}catch(_){message('初期化できませんでした。')}}
  if(button.dataset.mode)saveMode(button.dataset.mode);
});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.matches('[data-note]'))save('notes',el.dataset.note,el.value.slice(0,20000));
  if(el.id==='recording-search'){const q=el.value.normalize('NFKC').toLowerCase().trim();$('#recording-results').innerHTML=catalogRows(COURSE.recordings.filter(r=>[r.title,r.artist,r.prompt,r.version].join(' ').normalize('NFKC').toLowerCase().includes(q)))}
  if(el.id==='artist-search'){const q=el.value.normalize('NFKC').toLowerCase().trim();$('#artist-results').innerHTML=artistRows(COURSE.artists.filter(a=>a.name.normalize('NFKC').toLowerCase().includes(q)))}
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.dataset.completed)save('lessonCompleted',el.dataset.completed,el.checked);
  if(el.dataset.observed)save('recordingObserved',el.dataset.observed,el.checked);
  if(el.id==='import-file')importJSON(el.files[0]);
});
$('#menu-toggle').addEventListener('click',()=>{const open=$('.sidebar').classList.toggle('open');$('#menu-toggle').setAttribute('aria-expanded',String(open));$('#menu-toggle').innerHTML=open?'目次を閉じる <span aria-hidden="true">−</span>':'目次を開く <span aria-hidden="true">＋</span>'});
window.addEventListener('hashchange',render);
window.addEventListener('storage',event=>{if(event.key!==STORAGE_KEY)return;try{const incoming=fromStorage();const note=document.activeElement?.dataset?.note;if(note&&incoming.notes[note]!==state.notes[note]){message('別タブで同じメモが変更されました。入力中の文章は保持しています。バックアップしてから確認してください。');return}state=incoming;render();message('別タブの変更を反映しました。')}catch(_){message('別タブのデータを読み込めません。現在の入力は保持しています。')}});
nav();render();if(brokenRaw!==null)message('保存済みデータを読み込めません。元データは保持しています。「記録」から書き出せます。');
</script>
</body>
</html>
